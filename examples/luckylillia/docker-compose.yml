# LuckyLillia 直连（无头）模式示例，镜像与结构对齐官方 install-llbot-docker.sh。
# 启动后访问 http://localhost:3080 完成 WebUI 登录；填入 AUTO_LOGIN_QQ
# 可在重启后自动恢复该 QQ 号（留空则每次从登录页选择账号）。
services:
  llbot:
    image: linyuchen/llbot:latest
    ports:
      - "3080:3080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WEBUI_PORT=3080
      - AUTO_LOGIN_QQ=
    volumes:
      - ./llbot_config:/app/llbot/data:rw
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:'+(process.env.WEBUI_PORT||3080)).then(()=>process.exit(0),()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
