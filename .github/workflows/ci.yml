name: CI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Cross-compile check
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/alemonx-docker-linux ./runner
          GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/alemonx-docker-windows.exe ./runner
          GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/alemonx-docker-darwin ./runner
          GOOS=darwin GOARCH=amd64 go build -trimpath -o /tmp/alemonx-docker-darwin-amd64 ./runner
      - name: Validate alx.json
        run: go run ./cmd/alxman validate alx.json
      - name: Set manifest version from tag
        run: go run ./cmd/alxman set-version "$GITHUB_REF_NAME"
      - name: Validate release version
        run: go run ./cmd/alxman check-version "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --non-interactive && yarn build
        working-directory: frontend
      - run: yarn test
        working-directory: frontend
  web:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: yarn install --non-interactive && yarn build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, binary: alemonx-docker-windows-amd64.exe, bundle: alemonx-docker-windows-amd64.zip }
          - { goos: darwin, goarch: arm64, binary: alemonx-docker-darwin-arm64, bundle: alemonx-docker-darwin-arm64.zip }
          - { goos: darwin, goarch: amd64, binary: alemonx-docker-darwin-amd64, bundle: alemonx-docker-darwin-amd64.zip }
          - { goos: linux, goarch: amd64, binary: alemonx-docker-linux-amd64, bundle: alemonx-docker-linux-amd64.zip }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web
      - name: Set manifest version from tag
        run: go run ./cmd/alxman set-version "$GITHUB_REF_NAME"
      - name: Build plugin bundle
        run: |
          mkdir -p "bundle/alemonx-docker/dist" release
          cp alx.json "bundle/alemonx-docker/alx.json"
          cp -r web "bundle/alemonx-docker/web"
          cp recommendations.md "bundle/alemonx-docker/recommendations.md"
          cp -r examples "bundle/alemonx-docker/examples"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o "bundle/alemonx-docker/dist/${{ matrix.binary }}" ./runner
          (cd bundle && zip -r "../release/${{ matrix.bundle }}" alemonx-docker)
          (cd release && sha256sum "${{ matrix.bundle }}" > "${{ matrix.bundle }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
          pattern: '*.zip'
      - run: |
          cat release/*.sha256 > release/SHA256SUMS
          rm release/*.sha256
          gh release create "${GITHUB_REF_NAME}" release/*.zip release/SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
